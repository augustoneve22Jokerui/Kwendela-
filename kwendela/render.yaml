services:
  - type: web
    name: kwendela
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: KWENDELA
      - key: APP_URL
        value: https://kwendela.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "20"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: COOKIE_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://kwendela.onrender.com
      - key: SUPERADMIN_NAME
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "KWENDELA <noreply@kwendela.ao>"
      - key: MAPS_PROVIDER
        value: mapbox
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: UPLOAD_MAX_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: public/uploads
      - key: WALLET_DEMO_MODE
        value: "true"
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: WAITLIST_CONFIRMATION_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: info